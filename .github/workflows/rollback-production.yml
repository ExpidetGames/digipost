name: Rollback production

# Puts a previous deployment back into production, with the deployment id (dpl_...) or the deployment address
# (https://....vercel.app) to restore, from the Vercel dashboard or from the summary of an earlier run of
# deploy-production. It first checks, with the Vercel API, that the deployment is a ready production deployment of
# this project and team, then runs `vercel rollback` with the pinned CLI. A rollback does not undo a migration
# (scripts/deploy/README.md, "Rolling back"): it is safe while the migrations since were additive. After a rollback
# Vercel stops assigning the production domain to new deployments of the project; the `vercel promote` of the next
# deploy-production run assigns it again.
#
# Manual only, and only for this repository on main (the job's own condition guards against accidents; the boundary is
# the environment `production`, restricted to main). It has a queue of its own: an emergency rollback must not wait
# behind a deployment, and a waiting deployment must not drop a waiting rollback. It needs no approval: whoever can
# run a workflow on main can roll back.
on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Deployment to restore: its id (dpl_...) or its address (https://....vercel.app)"
        required: true

permissions:
  contents: read

concurrency:
  group: rollback-production
  cancel-in-progress: false

env:
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  rollback:
    name: Roll production back
    if: ${{ github.repository == 'ExpidetGames/digipost' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the input
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYMENT}" =~ ^dpl_[A-Za-z0-9]{8,64}$ ]] && ! [[ "${DEPLOYMENT}" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::A deployment is a Vercel deployment id (dpl_...) or a deployment address (https://....vercel.app)."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the Vercel CLI
        uses: ./.github/actions/vercel-cli
      - name: Load the Vercel credentials from Infisical
        uses: ./.github/actions/infisical-ci-secrets
        with:
          secret-names: VERCEL_TOKEN VERCEL_TEAM_ID VERCEL_APP_PROJECT_ID
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          consequence: Nothing was rolled back.
      # Asks the Vercel API what the deployment is, before anything is moved: a ready deployment of this project, built
      # for production. The token goes in a header file (an argument would show up in the process list). Only the
      # verdict is printed, never the response.
      - name: Check that the deployment is a ready production deployment of this project
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          umask 077
          header_file="${RUNNER_TEMP}/vercel-auth-header"
          printf 'Authorization: Bearer %s\n' "${VERCEL_TOKEN}" > "${header_file}"
          body_file="${RUNNER_TEMP}/deployment.json"
          # The API takes an id or a host name.
          reference="${DEPLOYMENT#https://}"
          status="$(
            curl --silent --output "${body_file}" --write-out '%{http_code}' --max-time 30 \
              --header @"${header_file}" \
              "https://api.vercel.com/v13/deployments/${reference}?teamId=${VERCEL_TEAM_ID}" || true
          )"
          if [ "${status}" != "200" ]; then
            echo "::error::The Vercel API did not return the deployment (status ${status})."
            exit 1
          fi
          project="$(jq -r '.projectId // empty' "${body_file}")"
          target="$(jq -r '.target // empty' "${body_file}")"
          state="$(jq -r '.readyState // empty' "${body_file}")"
          if [ "${project}" != "${VERCEL_APP_PROJECT_ID}" ]; then
            echo "::error::That deployment belongs to another project."
            exit 1
          fi
          if [ "${target}" != "production" ] || [ "${state}" != "READY" ]; then
            echo "::error::That deployment is not a ready production deployment."
            exit 1
          fi
          echo "The deployment is a ready production deployment of this project."
      - name: Roll back
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          VERCEL_ORG_ID: ${{ env.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_APP_PROJECT_ID }}
        run: vercel rollback "$DEPLOYMENT" --yes --timeout 5m
